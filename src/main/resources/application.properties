spring.application.name=civicpulse

#Database connection
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

spring.jpa.hibernate.ddl-auto=update

# Issue and resolution photos are multipart uploads. The default 1 MB limit
# rejects most phone photos before the controller can process them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring Data Redis Configuration
spring.data.redis.host=${RADIS_HOST}
spring.data.redis.port=${REDIS_PORT}

#Brevo API
brevo.api.key=${BREVO_API_KEY}

#JWT secret key
jwt.secret=${JWT_SECRET}

#Default password
# Seed account password. DEFAULT_PASSWORD can override this in deployment.
default.password=${DEFAULT_PASSWORD:Pass@123}
