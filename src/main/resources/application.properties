spring.application.name=civicpulse

# Render supplies PORT to public web services. The default keeps local development on 8080.
server.port=${PORT:8080}

#Database connection
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

spring.jpa.hibernate.ddl-auto=update

# Issue and resolution photos are multipart uploads. The default 1 MB limit
# rejects most phone photos before the controller can process them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring Data Redis Configuration
# Render Key Value exposes a redis:// connection string; the fallback supports local Redis.
spring.data.redis.url=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}

#Brevo API
brevo.api.key=${BREVO_API_KEY}

#JWT secret key
jwt.secret=${JWT_SECRET}

# Uploaded images are written to a persistent Render disk in production.
# Keep the Windows location as the default for local development.
app.images.directory=${IMAGE_UPLOAD_DIR:D:/Images}

# Comma-separated browser origins permitted to call the public API.
# Replace the Vercel wildcard with the final production domain after deployment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}

# Seed account password. Set DEFAULT_PASSWORD before the first deployment.
default.password=${DEFAULT_PASSWORD}
