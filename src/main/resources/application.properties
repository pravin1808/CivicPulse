spring.application.name=civicpulse

#Database connection
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update

# Issue and resolution photos are multipart uploads. The default 1 MB limit
# rejects most phone photos before the controller can process them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring Data Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

#Brevo API
brevo.api.key=${BREVO_API_KEY}

#JWT secret key
jwt.secret=${JWT_SECRET}

#Default password
# Seed account password. DEFAULT_PASSWORD can override this in deployment.
default.password=${DEFAULT_PASSWORD:Pass@123}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Frontend URL for CORS (comma-separated if multiple)
frontend.url=${FRONTEND_URL:http://localhost:5173}
